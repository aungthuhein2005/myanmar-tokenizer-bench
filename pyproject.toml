[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myanmar-tokenizer-bench"
version = "0.1.0"
description = "How many tokens do LLM tokenizers spend on Burmese (Myanmar) compared with English?"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["burmese", "myanmar", "tokenizer", "llm", "benchmark", "nlp"]
dependencies = [
  "tiktoken>=0.7",
  "tokenizers>=0.19",
  "huggingface_hub>=0.23",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
api = ["anthropic>=0.70", "httpx>=0.27"]
dev = ["pytest>=8"]

[project.scripts]
mtb = "mtb.cli:main"

[tool.setuptools.packages.find]
include = ["mtb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
